<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 LGS Puan Hesaplayıcı</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .lesson-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .inputs {
            display: flex;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        input[type="number"] {
            width: 50px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-card {
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
            display: none;
        }

        .result-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }

        .result-nets {
            color: var(--text-sub);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 LGS 2026 Puan Hesaplama</h1>
    <p class="subtitle">MEB Katsayılarına Uygun Güncel Otomasyon</p>

    <div id="lessons"></div>

    <button onclick="calculate()">Puanı Hesapla</button>

    <div class="result-card" id="resultCard">
        <div>Tahmini LGS Puanınız</div>
        <div class="result-score" id="totalScore">0.00</div>
        <div class="result-nets" id="totalNet">Toplam Net: 0.00 / 100</div>
    </div>
</div>

<script>
    const lessonsData = [
        { id: 'tr', name: 'Türkçe', max: 20, coef: 4.0 },
        { id: 'mat', name: 'Matematik', max: 20, coef: 4.0 },
        { id: 'fen', name: 'Fen Bilimleri', max: 20, coef: 4.0 },
        { id: 'ink', name: 'İnkılap Tarihi', max: 10, coef: 1.0 },
        { id: 'din', name: 'Din Kültürü', max: 10, coef: 1.0 },
        { id: 'dil', name: 'Yabancı Dil', max: 10, coef: 1.0 }
    ];

    const lessonsContainer = document.getElementById('lessons');

    lessonsData.forEach(l => {
        lessonsContainer.innerHTML += `
            <div class="lesson-card">
                <div class="lesson-name">${l.name} <span style="font-size:0.8rem; color:var(--text-sub);">(${l.max} Soru)</span></div>
                <div class="inputs">
                    <div class="input-group">
                        <label>Doğru</label>
                        <input type="number" id="${l.id}_d" min="0" max="${l.max}" value="0">
                    </div>
                    <div class="input-group">
                        <label>Yanlış</label>
                        <input type="number" id="${l.id}_y" min="0" max="${l.max}" value="0">
                    </div>
                </div>
            </div>
        `;
    });

    function calculate() {
        let totalWeightedNets = 0;
        let totalNetCount = 0;

        lessonsData.forEach(l => {
            let d = parseFloat(document.getElementById(`${l.id}_d`).value) || 0;
            let y = parseFloat(document.getElementById(`${l.id}_y`).value) || 0;

            if (d + y > l.max) {
                d = l.max;
                y = 0;
            }

            let net = d - (y / 3);
            if (net < 0) net = 0;

            totalNetCount += net;
            totalWeightedNets += net * l.coef;
        });

        let score = totalWeightedNets + 194.76;
        if (score > 500) score = 500;
        if (totalNetCount === 0) score = 0;

        document.getElementById('totalScore').innerText = score.toFixed(2);
        document.getElementById('totalNet').innerText = `Toplam Net: ${totalNetCount.toFixed(2)} / 100`;
        document.getElementById('resultCard').style.display = 'block';
    }
</script>

</body>
</html>
